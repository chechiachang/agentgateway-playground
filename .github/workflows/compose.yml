name: Docker Compose
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare Compose environment
        run: |
          cp .env.example .env
          python3 scripts/setup-env.py
          sed -i \
            -e 's/^GITHUB_OAUTH_CLIENT_ID=$/GITHUB_OAUTH_CLIENT_ID=ci-placeholder/' \
            -e 's/^GITHUB_OAUTH_CLIENT_SECRET=$/GITHUB_OAUTH_CLIENT_SECRET=ci-placeholder/' \
            -e 's/^AZURE_OPENAI_BASE_URL=.*/AZURE_OPENAI_BASE_URL=https:\/\/example.invalid/' \
            .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build Compose services
        run: docker compose build
