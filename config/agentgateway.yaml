# yaml-language-server: $schema=https://raw.githubusercontent.com/agentgateway/agentgateway/v1.7.0/schema/config.json
config:
  adminAddr: 'off'
  modelCatalog:
    - file: /config/costs/catalog.json
  database:
    url: $AGENTGATEWAY_DATABASE_URL
  logging:
    level: info
    format: json
  session:
    key: $AGENTGATEWAY_SESSION_KEY
  standardAttributes:
    user: 'apiKey != null ? apiKey.username : jwt.username'

frontendPolicies:
  accessLog:
    database:
      llm: metadata

gateways:
  default:
    port: 4000

ui:
  gateways: [default]
  policies:
    oidc:
      issuer: http://localhost:5556/dex
      authorizationEndpoint: http://localhost:5556/dex/auth
      tokenEndpoint: http://vault:5556/dex/token
      jwks:
        url: http://vault:5556/dex/keys
      clientId: agentgateway-ui
      clientSecret: "$DEX_AGENTGATEWAY_CLIENT_SECRET"
      redirectURI: http://localhost:4000/oauth/callback
      scopes: [profile, email]
      credentials: session
    authorization:
      rules:
        - allow: 'jwt.preferred_username == "$GITHUB_USER"'

llm:
  gateways: [default]
  policies:
    # Permissive auth plus the allow rule below means either valid credential works.
    jwtAuth: &agent-jwt
      mode: permissive
      issuer: http://localhost:8200/v1/identity/oidc
      audiences: [agentgateway]
      jwks:
        url: http://vault:8200/v1/identity/oidc/.well-known/keys
      jwtValidationOptions:
        requiredClaims: [exp, iss, aud, sub, username]
    apiKey: &caller-api-key
      mode: permissive
      location:
        header:
          name: x-api-key
      keys:
        - keyHash: "sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"
          metadata:
            name: test
            username: test
            groups: [nationalteam:sre]
        - keyHash: "sha256:ed2e175af3a2d2aa5037e68c0abec158d3bec746917027bcce0c0e77ac8304a7"
          metadata:
            name: test-ratelimit
            username: test-ratelimit
            groups: [nationalteam:sre]
    authorization:
      rules:
        - allow: 'jwt != null || apiKey != null'
    remoteRateLimit:
      host: ratelimit:8081
      domain: agentgateway
      failureMode: failClosed
      descriptors:
        - entries:
            - key: user
              value: 'apiKey != null ? apiKey.username : jwt.username'
          type: requests
        # Charge model-catalog USD cost to JWT users only; API keys retain
        # the request-count descriptor above.
        - entries:
            - key: user_cost_month
              value: 'jwt.username'
          type: tokens
          cost: 'math.round(llm.cost.total * 1000000.0).uint()'
        # Give the `test` API key its own 10 USD monthly budget descriptor.
        - entries:
            - key: api_key_cost_month
              value: 'apiKey != null ? apiKey.username : ""'
          type: tokens
          cost: 'math.round(llm.cost.total * 1000000.0).uint()'
    # Global guardrails temporarily disabled; only *-guarded models opt in.
  models:
    - name: gpt-6-luna
      provider: openAI
      auth: &azure-auth
        key:
          value: "$AZURE_OPENAI_API_KEY"
          location:
            header:
              name: api-key
      params:
        model: gpt-6-luna
        baseUrl: "$AZURE_OPENAI_BASE_URL/openai/v1"
    - name: gpt-6.1-sol
      provider: openAI
      auth: *azure-auth
      params:
        model: gpt-6.1-sol
        baseUrl: "$AZURE_OPENAI_BASE_URL/openai/v1"
    # Opt-in strict demo guards; ordinary models support coding with example data.
    - name: gpt-6-luna-guarded
      provider: openAI
      # Local demo: reject input; mask buffered output or block matching SSE windows.
      guardrails: &chat-guardrails
        streaming: Enabled
        request:
          - regex:
              action: reject
              rules: &sensitive-patterns
                - builtin: ssn
                - pattern: 'AGW_DEMO_SECRET_[A-Z0-9]+'
            scope: [systemPrompt, messages, toolOutput, toolInput]
            rejection:
              status: 403
              body: 'Guardrail rejected sensitive input.'
        response:
          - regex:
              action: mask
              rules: *sensitive-patterns
            scope: [messages]
          # v1.7.0 cannot mask SSE. This follow-up rule blocks unmasked matches.
          - regex:
              action: reject
              rules: *sensitive-patterns
            scope: [messages]
      auth: *azure-auth
      params:
        model: gpt-6-luna
        baseUrl: "$AZURE_OPENAI_BASE_URL/openai/v1"
    - name: gpt-6.1-sol-guarded
      provider: openAI
      guardrails: *chat-guardrails
      auth: *azure-auth
      params:
        model: gpt-6.1-sol
        baseUrl: "$AZURE_OPENAI_BASE_URL/openai/v1"
    - name: text-embedding-3-large
      provider: openAI
      auth: *azure-auth
      params:
        model: text-embedding-3-large
        baseUrl: "$AZURE_OPENAI_BASE_URL/openai/v1"
    - name: decision-1
      provider:
        custom:
          formats:
            - type: systemOne
              path: /providers/microsoft/v1/systemone
      auth: *azure-auth
      params:
        model: decision-1
        baseUrl: "$AZURE_OPENAI_BASE_URL"

mcp:
  gateways: [default]
  prefixMode: always
  policies:
    jwtAuth: &vault-jwt
      mode: strict
      issuer: http://localhost:8200/v1/identity/oidc
      audiences: [agentgateway]
      jwks:
        url: http://vault:8200/v1/identity/oidc/.well-known/keys
      jwtValidationOptions:
        requiredClaims: [exp, iss, aud, sub, username]
    mcpAuthorization:
      rules:
        # SRE-group JWTs can use all tools; other JWTs need explicit tool grants.
        - allow: 'jwt != null && jwt.groups != null && jwt.groups.exists(group, group == "nationalteam:sre")'
        # MCP names are target-prefixed because prefixMode is always.
        - allow: 'mcp.tool.name == "playground_calculate" && jwt.access == "tools:calculate"'
        - allow: 'mcp.tool.name == "playground_text_stats" && jwt.access == "tools:text-stats"'
        - allow: 'mcp.tool.name == "playground_reverse_text" && jwt.access == "tools:reverse-text"'
        - allow: 'mcp.tool.name == "postgres_postgres_list_tables" && jwt.access == "tools:postgres-read"'
        - allow: 'mcp.tool.name == "postgres_postgres_list_databases" && jwt.access == "tools:postgres-read"'
        - allow: 'mcp.tool.name == "postgres_postgres_describe_table" && jwt.access == "tools:postgres-read"'
        - allow: 'mcp.tool.name == "postgres_postgres_query" && jwt.access == "tools:postgres-read"'
  targets:
    - name: playground
      mcp:
        host: demo-tools-agents
        port: 8080
        path: /mcp
    - name: postgres
      mcp:
        host: postgres-mcp
        port: 8081
        path: /mcp

routes:
  - name: coder-agent
    gateways: [default]
    matches:
      - path:
          pathPrefix: /agents/coder
    policies:
      jwtAuth: *agent-jwt
      apiKey: *caller-api-key
      authorization:
        rules:
          - allow: '(jwt != null && jwt.groups != null && jwt.groups.exists(group, group == "nationalteam:sre")) || (apiKey != null && apiKey.groups != null && apiKey.groups.exists(group, group == "nationalteam:sre"))'
      a2a: {}
      backendAuth:
        key:
          value: "$CODEX_AGENT_TOKEN"
          location:
            header:
              name: x-codex-agent-token
    backends:
      - host: "$CODEX_AGENT_BACKEND"
  - name: calculator-agent
    gateways: [default]
    matches:
      - path:
          pathPrefix: /agents/calculator
    policies:
      jwtAuth: *agent-jwt
      apiKey: *caller-api-key
      authorization:
        rules:
          - allow: '(jwt != null && jwt.groups != null && jwt.groups.exists(group, group == "nationalteam:sre")) || (apiKey != null && apiKey.groups != null && apiKey.groups.exists(group, group == "nationalteam:sre"))'
      a2a: {}
    backends:
      - host: demo-tools-agents:8080
