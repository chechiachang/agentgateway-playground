      jwtAuth: *agent-jwt
      apiKey: *caller-api-key
      authorization:
        rules:
          - allow: '(jwt != null && jwt.groups != null && jwt.groups.exists(group, group == "nationalteam:sre")) || (apiKey != null && apiKey.groups != null && apiKey.groups.exists(group, group == "nationalteam:sre"))'
      a2a: {}
    backends:
      - host: demo-tools-agents:8080
  - name: data-analyst-agent
    gateways: [default]
    matches:
      - path:
          pathPrefix: /agents/data-analyst
    policies:
      jwtAuth: *agent-jwt
      apiKey: *caller-api-key
