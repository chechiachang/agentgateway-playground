services:
  postgres:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    image: postgres:18.6
    user: "postgres"
    environment:
      POSTGRES_DB: agentdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run make setup}
      MCP_DB_PASSWORD: ${MCP_DB_PASSWORD:?Run make setup}
    volumes:
      - postgres-data-v18:/var/lib/postgresql
      - ./examples/postgres-init.sh:/docker-entrypoint-initdb.d/10-mcp-reader.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentdb"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres-mcp:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    build: ./examples
    image: agentgateway-playground-examples:local
    user: "65532:65532"
    read_only: true
    command: ["python", "-B", "/demo/postgres-mcp.py"]
    environment:
      DATABASE_URL: postgres://mcp_reader:${MCP_DB_PASSWORD:?Run make setup}@postgres:5432/agentdb?sslmode=disable
    volumes:
      - ./examples/postgres-mcp.py:/demo/postgres-mcp.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy

  vault:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    image: hashicorp/vault:2.2.1
    command: server -dev -dev-listen-address=0.0.0.0:8200 -config=/vault/config/demo.hcl
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:?Copy .env.example to .env}
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "127.0.0.1:8200:8200"
      - "127.0.0.1:5556:5556"
      - "127.0.0.1:8250:8250"
    volumes:
      - type: bind
        source: ./config/vault.hcl
        target: /vault/config/demo.hcl
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 2s
      timeout: 3s
      retries: 30

  dex:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    image: ghcr.io/dexidp/dex:v2.46.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    # Vault and the browser must resolve the same localhost OIDC issuer.
    network_mode: service:vault
    environment:
      GITHUB_ORG: ${GITHUB_ORG}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:?Set GitHub OAuth App client ID in .env}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:?Set GitHub OAuth App client secret in .env}
      DEX_VAULT_CLIENT_SECRET: ${DEX_VAULT_CLIENT_SECRET:?Set DEX_VAULT_CLIENT_SECRET in .env}
      DEX_AGENTGATEWAY_CLIENT_SECRET: ${DEX_AGENTGATEWAY_CLIENT_SECRET:?Set DEX_AGENTGATEWAY_CLIENT_SECRET in .env}
    volumes:
      - type: bind
        source: ./config/dex.yaml
        target: /etc/dex/config.yaml
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      vault:
        condition: service_healthy

  vault-init:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    image: hashicorp/vault:2.2.1
    entrypoint: ["/bin/sh", "/demo/vault-init.sh"]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID}
      GITHUB_ORG: ${GITHUB_ORG}
      GITHUB_USER: ${GITHUB_USER}
      GITHUB_TEAMS: ${GITHUB_TEAMS:-}
      DEX_VAULT_CLIENT_SECRET: ${DEX_VAULT_CLIENT_SECRET}
    volumes:
      - ./scripts/vault-init.sh:/demo/vault-init.sh:ro
      - ./config/vault-agentgateway-policy.hcl:/demo/vault-agentgateway-policy.hcl:ro
      - ./config/vault-jwt-template.json:/demo/vault-jwt-template.json:ro
    depends_on:
      vault:
        condition: service_healthy
      dex:
        condition: service_started

  demo-tools-agents:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    build: ./examples
    image: agentgateway-playground-examples:local
    user: "65532:65532"
    read_only: true
    command: ["python", "-B", "/demo/demo-server.py"]
    volumes:
      - ./examples/demo-server.py:/demo/demo-server.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    image: valkey/valkey:8
    # Skip the root entrypoint's ownership scan; persisted files belong to valkey.
    user: "999:999"
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  ratelimit:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    image: envoyproxy/ratelimit:8fe6ea42
    environment:
      REDIS_SOCKET_TYPE: tcp
      REDIS_URL: valkey:6379
      RUNTIME_ROOT: /data
      RUNTIME_SUBDIRECTORY: ratelimit
      RUNTIME_WATCH_ROOT: "false"
      USE_STATSD: "false"
      LOG_LEVEL: info
    volumes:
      - type: bind
        source: ./config/ratelimit.yaml
        target: /data/ratelimit/config/config.yaml
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      valkey:
        condition: service_healthy

  codex-agent:
    profiles: [coder]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    build:
      context: ./examples
      dockerfile: codex/Dockerfile
    image: agentgateway-playground-codex:local
    init: true
    user: "1000:1000"
    read_only: true
    environment:
      CODEX_AGENT_HOST: 0.0.0.0
      CODEX_AGENT_SANDBOX: container
      CODEX_AGENT_TOKEN: ${CODEX_AGENT_TOKEN:?Run make setup}
      CODEX_WORKSPACE: /workspace
      CODEX_MODEL: ${CODEX_MODEL:-gpt-6-luna}
      CODEX_MODEL_BASE_URL: http://agentgateway:4000/v1
      CODEX_MODEL_API_KEY: ${CODEX_MODEL_API_KEY:-test}
    volumes:
      - codex-workspace:/workspace
      - codex-state:/home/node/.codex
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      agentgateway:
        condition: service_started

  agentgateway:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    image: cr.agentgateway.dev/agentgateway:v1.7.0
    command: ["-f", "/config/config.yaml"]
    environment:
      AZURE_OPENAI_BASE_URL: ${AZURE_OPENAI_BASE_URL:?Set AZURE_OPENAI_BASE_URL in .env}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AGENTGATEWAY_DATABASE_URL: ${AGENTGATEWAY_DATABASE_URL:-}
      GITHUB_USER: ${GITHUB_USER}
      DEX_AGENTGATEWAY_CLIENT_SECRET: ${DEX_AGENTGATEWAY_CLIENT_SECRET}
      AGENTGATEWAY_SESSION_KEY: ${AGENTGATEWAY_SESSION_KEY:?Set a 64-character hex session key in .env}
      OIDC_COOKIE_SECRET: ${OIDC_COOKIE_SECRET:?Run make setup}
      CODEX_AGENT_TOKEN: ${CODEX_AGENT_TOKEN:?Run make setup}
      CODEX_AGENT_BACKEND: ${CODEX_AGENT_BACKEND:-codex-agent:8082}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - type: bind
        source: ./config/agentgateway.yaml
        target: /config/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/model-catalog
        target: /config/costs
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      demo-tools-agents:
        condition: service_healthy
      postgres-mcp:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      ratelimit:
        condition: service_started

volumes:
  postgres-data-v18:
  valkey-data:
  codex-state:
  codex-workspace:
